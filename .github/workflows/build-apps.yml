name: Build apps

# Builds the double-click apps and publishes them as a GitHub release.
# Runs on every change to the code, and once a month so the YouTube
# downloader (yt-dlp) inside the apps stays up to date.
on:
  push:
    branches: [main]
    paths: ["swimtunes/**", "packaging/**", "pyproject.toml", "SwimTunes.pyw", ".github/workflows/build-apps.yml"]
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          base=$(python3 -c "import re;print('.'.join(re.search(r'__version__ = \"([^\"]+)\"', open('swimtunes/__init__.py').read()).group(1).split('.')[:2]))")
          echo "tag=v${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: SwimTunes-Windows.exe
            extra: SwimTunes-Setup.exe
          - os: macos-latest
            asset: SwimTunes-Mac-AppleSilicon.zip
            extra: SwimTunes-Mac-AppleSilicon.dmg
          - os: macos-15-intel
            asset: SwimTunes-Mac-Intel.zip
            extra: SwimTunes-Mac-Intel.dmg
    runs-on: ${{ matrix.os }}
    env:
      SWIMTUNES_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --upgrade "yt-dlp[default,deno]"
          pip install . pyinstaller pillow
          pip install pystray
      - name: Stamp version
        shell: bash
        run: echo "TAG = \"$SWIMTUNES_TAG\"" > swimtunes/_build.py
      - name: Build
        run: pyinstaller packaging/swimtunes.spec --noconfirm

      - name: Check and package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./dist/SwimTunes.exe doctor
          # the installer (Start menu, desktop icon, uninstall in Settings > Apps)
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress; fi
          "$ISCC" //DAppVersion="${SWIMTUNES_TAG#v}" //DSourceExe="$(cygpath -w "$PWD/dist/SwimTunes.exe")" packaging/windows-installer.iss
          mv dist/SwimTunes-Setup.exe "${{ matrix.extra }}"
          mv dist/SwimTunes.exe "${{ matrix.asset }}"
      - name: Check and package (Mac)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/SwimTunes.app
          ./dist/SwimTunes.app/Contents/MacOS/SwimTunes doctor
          ditto -c -k --keepParent dist/SwimTunes.app "${{ matrix.asset }}"
          # a disk image: open it and drag SwimTunes onto Applications
          mkdir dmg && cp -R dist/SwimTunes.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname SwimTunes -srcfolder dmg -ov -format UDZO "${{ matrix.extra }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.extra }}

  release:
    needs: [build, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: SwimTunes.pyw
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: cp src/SwimTunes.pyw assets/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -la assets
          gh release create "$TAG" assets/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "SwimTunes $TAG" --latest --notes "Download the file for your computer below.

          - **Windows:** SwimTunes-Setup.exe (installer: Start menu and desktop icon). No install: SwimTunes-Windows.exe
          - **Mac (2020 or newer, M1/M2/M3/M4):** SwimTunes-Mac-AppleSilicon.dmg
          - **Older Mac (Intel):** SwimTunes-Mac-Intel.dmg

          - **Windows blocks the app ("Smart App Control")?** Install Python from python.org, then download SwimTunes.pyw and double-click it.

          The .zip files are used by SwimTunes' automatic updates.

          First time? See the instructions: https://github.com/${{ github.repository }}#readme"

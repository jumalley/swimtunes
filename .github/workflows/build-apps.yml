name: Build apps

# Builds the apps and publishes them as a GitHub release.
#  - When the version in swimtunes/__init__.py changes: release "v<version>" (e.g. v0.9.0).
#    Pushes that don't change the version only run the tests (tests.yml).
#  - Once a month (and when started by hand): the same version rebuilt with the newest
#    YouTube downloader (yt-dlp), released as "v<version>.<run number>" (e.g. v0.9.0.57),
#    so installed copies update to it.
on:
  push:
    branches: [main]
    paths: ["swimtunes/**", "packaging/**", "pyproject.toml", "SwimTunes.pyw", ".github/workflows/build-apps.yml"]
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('swimtunes/__init__.py').read()).group(1))")
          if [ "${{ github.event_name }}" = "push" ]; then tag="v${version}"; else tag="v${version}.${{ github.run_number }}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$tag is already released: nothing to build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "Building $tag"
          fi

  build:
    needs: [test, version]
    if: needs.version.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: SwimTunes-Windows.exe
            extra: SwimTunes-Setup.exe
          - os: macos-latest
            asset: SwimTunes-Mac-AppleSilicon.zip
            extra: SwimTunes-Mac-AppleSilicon.dmg
          - os: macos-15-intel
            asset: SwimTunes-Mac-Intel.zip
            extra: SwimTunes-Mac-Intel.dmg
    runs-on: ${{ matrix.os }}
    env:
      SWIMTUNES_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --upgrade "yt-dlp[default,deno]"
          pip install . pyinstaller pillow
          pip install pystray
      - name: Stamp version
        shell: bash
        run: echo "TAG = \"$SWIMTUNES_TAG\"" > swimtunes/_build.py
      - name: Build
        run: pyinstaller packaging/swimtunes.spec --noconfirm

      - name: Check and package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./dist/SwimTunes.exe doctor
          # the installer (Start menu, desktop icon, uninstall in Settings > Apps)
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress; fi
          "$ISCC" //DAppVersion="${SWIMTUNES_TAG#v}" //DSourceExe="$(cygpath -w "$PWD/dist/SwimTunes.exe")" packaging/windows-installer.iss
          mv dist/SwimTunes-Setup.exe "${{ matrix.extra }}"
          mv dist/SwimTunes.exe "${{ matrix.asset }}"
      - name: Check and package (Mac)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/SwimTunes.app
          ./dist/SwimTunes.app/Contents/MacOS/SwimTunes doctor
          ditto -c -k --keepParent dist/SwimTunes.app "${{ matrix.asset }}"
          # a disk image: open it and drag SwimTunes onto Applications
          mkdir dmg && cp -R dist/SwimTunes.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname SwimTunes -srcfolder dmg -ov -format UDZO "${{ matrix.extra }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.extra }}

  release:
    needs: [build, version]
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the history, for "What's new"
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: cp src/SwimTunes.pyw assets/
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # "What's new" = the commit titles since the previous release (the app shows these in its update banner)
          prev=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName')
          {
            echo "## What's new"
            echo
            if [ -n "$prev" ] && git -C src rev-parse -q --verify "refs/tags/$prev" > /dev/null; then
              git -C src log --no-merges --format='- %s' "$prev..HEAD" | head -15
            fi
            if [ "${{ github.event_name }}" != "push" ]; then echo "- The newest YouTube downloader (yt-dlp), for YouTube changes"; fi
            echo
            echo "## Download"
            echo
            echo "- **Windows:** SwimTunes-Setup.exe (installer). No install: SwimTunes-Windows.exe"
            echo "- **Windows blocks it (Smart App Control)?** Install Python from python.org, then double-click SwimTunes.pyw"
            echo "- **Mac with Apple chip (M1, M2, M3...):** SwimTunes-Mac-AppleSilicon.dmg"
            echo "- **Mac with Intel processor:** SwimTunes-Mac-Intel.dmg"
            echo
            echo "The .zip files are used by automatic updates. Instructions: https://github.com/${{ github.repository }}#download"
          } > notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -la assets
          gh release create "$TAG" assets/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "SwimTunes $TAG" --latest --notes-file notes.md

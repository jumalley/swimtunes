name: Tests

# Runs on every push and pull request, and before every release build.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[test]"
      - name: Lint (mistakes only)
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  browser:
    name: Dashboard in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[test]"
      - name: Install Chromium for Playwright
        run: |
          npm install --no-save playwright@1.63.0 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Every tab, computer and phone, English and French
        run: |
          mkdir -p shots
          python tests/browser/sample_server.py 8799 > server.log 2>&1 &
          node tests/browser/smoke.js http://localhost:8799 shots
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: |
            shots
            server.log

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "swimtunes"
version = "0.10.2"
description = "Download YouTube/Spotify music as MP3 for swimming earphones, without duplicates"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "yt-dlp[default,deno]>=2026.10.26",
  "imageio-ffmpeg>=0.6",
  "mutagen>=1.47",
  "flask>=3.0",
  "segno>=1.6",     # QR code to open SwimTunes on a phone
]

[project.optional-dependencies]
test = ["pytest", "pytest-timeout", "ruff"]

[project.scripts]
swimtunes = "swimtunes.cli:main"

[project.gui-scripts]
swimtunes-app = "swimtunes.app:main"

[tool.setuptools]
packages = ["swimtunes"]

[tool.setuptools.package-data]
swimtunes = ["templates/*.html", "static/*", "static/js/*", "static/fa/*", "static/fa/css/*", "static/fa/webfonts/*"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-include = ["SwimTunes.pyw"]

[tool.ruff.lint]
# real mistakes only: undefined/unused names, syntax errors, likely bugs
select = ["F", "E9", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120   # a test waiting for something that never comes fails instead of hanging

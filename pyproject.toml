[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "swimtunes"
version = "0.8.3"
description = "Download YouTube/Spotify music as MP3 for swimming earphones, without duplicates"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp[default,deno]>=2026.10.26",
  "imageio-ffmpeg>=0.6",
  "mutagen>=1.47",
  "flask>=3.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
swimtunes = "swimtunes.cli:main"

[project.gui-scripts]
swimtunes-app = "swimtunes.app:main"

[tool.setuptools]
packages = ["swimtunes"]

[tool.setuptools.package-data]
swimtunes = ["templates/*.html", "static/*", "static/fa/*", "static/fa/css/*", "static/fa/webfonts/*"]
